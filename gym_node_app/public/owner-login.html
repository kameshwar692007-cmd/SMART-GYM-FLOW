<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Owner Login - Smart Gym</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container" style="max-width: 480px; margin-top: 80px;">
        <a href="/" style="color: var(--text-secondary); text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 20px;">&larr; Back to Portal Selection</a>
        
        <div class="card" style="border: 1px solid #4338ca; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);">
            <div style="text-align: center; margin-bottom: 24px;">
                <div style="font-size: 38px; margin-bottom: 8px;">🏢</div>
                <h1 style="font-size: 26px; font-weight: 800;">Gym Owner Login</h1>
                <p style="color: var(--text-secondary); font-size: 14px; margin-top: 4px;">Enter your credentials to access the facility dashboard.</p>
            </div>

            <form id="ownerLoginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="ownerUsername" value="owner" required placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="ownerPassword" value="admin123" required placeholder="Enter password">
                </div>
                <div id="loginError" style="color: var(--accent-red); font-size: 13px; margin-bottom: 15px; display: none;"></div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In as Owner</button>
            </form>

            <div style="margin-top: 20px; padding: 12px; background: #1e1b4b; border-radius: 8px; font-size: 12px; color: #c7d2fe;">
                💡 <b>Demo Credentials:</b><br>
                Username: <code>owner</code> | Password: <code>admin123</code>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('ownerLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('ownerUsername').value;
            const password = document.getElementById('ownerPassword').value;
            const errDiv = document.getElementById('loginError');

            try {
                const res = await fetch('/api/owner/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/owner/dashboard';
                } else {
                    errDiv.style.display = 'block';
                    errDiv.innerText = data.message;
                }
            } catch (err) {
                errDiv.style.display = 'block';
                errDiv.innerText = "Connection error. Is the server running?";
            }
        });
    </script>
</body>
</html>
